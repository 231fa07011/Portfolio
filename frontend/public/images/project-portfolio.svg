<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)" />

  <circle cx="200" cy="100" r="140" fill="#e0e7ff" opacity="0.4" />
  <circle cx="650" cy="350" r="140" fill="#f3e8ff" opacity="0.4" />

  <!-- Code / Architecture diagram window -->
  <g filter="url(#shadow3)">
    <rect x="70" y="45" width="660" height="360" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="70" y="45" width="660" height="38" rx="16" fill="#181825" />
    <path d="M 70 83 L 730 83" stroke="#313244" stroke-width="1" />
    <circle cx="95" cy="64" r="5" fill="#f38ba8" />
    <circle cx="112" cy="64" r="5" fill="#f9e2af" />
    <circle cx="129" cy="64" r="5" fill="#a6e3a1" />
    <text x="400" y="68" font-family="Courier New, monospace" font-size="11" fill="#a6adc8" text-anchor="middle">api/portfolio • Express REST Architecture (No DB)</text>

    <!-- Architecture Boxes inside terminal/editor -->
    <g transform="translate(110, 110)">
      <!-- Client Box -->
      <rect x="0" y="20" width="160" height="180" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2" />
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#89b4fa" text-anchor="middle">React Frontend</text>
      <text x="80" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#bac2de" text-anchor="middle">Vite + Tailwind</text>
      <line x1="20" y1="85" x2="140" y2="85" stroke="#45475a" stroke-width="1" />
      <text x="80" y="110" font-family="Courier New, monospace" font-size="10" fill="#cdd6f4" text-anchor="middle">Framer Motion</text>
      <text x="80" y="130" font-family="Courier New, monospace" font-size="10" fill="#cdd6f4" text-anchor="middle">Axios / Fetch API</text>
      <text x="80" y="150" font-family="Courier New, monospace" font-size="10" fill="#a6e3a1" text-anchor="middle">✓ Offline Fallback</text>
      <text x="80" y="170" font-family="Courier New, monospace" font-size="10" fill="#fab387" text-anchor="middle">✓ Error Retry</text>

      <!-- Connecting Arrows -->
      <path d="M 165 95 L 255 95" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4 2" />
      <polygon points="255,91 265,95 255,99" fill="#f9e2af" />
      <text x="215" y="85" font-family="Courier New, monospace" font-size="9" fill="#f9e2af" text-anchor="middle">HTTP GET/POST</text>

      <path d="M 255 130 L 165 130" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="4 2" />
      <polygon points="175,126 165,130 175,134" fill="#a6e3a1" />
      <text x="215" y="145" font-family="Courier New, monospace" font-size="9" fill="#a6e3a1" text-anchor="middle">JSON Payload</text>

      <!-- Server Box -->
      <rect x="270" y="20" width="160" height="180" rx="12" fill="#313244" stroke="#cba6f7" stroke-width="2" />
      <text x="350" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#cba6f7" text-anchor="middle">Express Server</text>
      <text x="350" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#bac2de" text-anchor="middle">Node.js REST API</text>
      <line x1="290" y1="85" x2="410" y2="85" stroke="#45475a" stroke-width="1" />
      <text x="350" y="110" font-family="Courier New, monospace" font-size="10" fill="#cdd6f4" text-anchor="middle">/api/health</text>
      <text x="350" y="130" font-family="Courier New, monospace" font-size="10" fill="#cdd6f4" text-anchor="middle">/api/portfolio</text>
      <text x="350" y="150" font-family="Courier New, monospace" font-size="10" fill="#cdd6f4" text-anchor="middle">/api/projects</text>
      <text x="350" y="170" font-family="Courier New, monospace" font-size="10" fill="#f38ba8" text-anchor="middle">/api/contact (POST)</text>

      <!-- Connecting arrow to JSON Cache -->
      <path d="M 435 110 L 475 110" stroke="#89b4fa" stroke-width="2" />
      <polygon points="475,106 485,110 475,114" fill="#89b4fa" />

      <!-- In-Memory / File Data Store -->
      <rect x="490" y="45" width="90" height="130" rx="8" fill="#45475a" stroke="#fab387" stroke-width="1.5" />
      <text x="535" y="70" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">📄</text>
      <text x="535" y="90" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#fab387" text-anchor="middle">portfolio</text>
      <text x="535" y="105" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#fab387" text-anchor="middle">.json</text>
      <rect x="500" y="125" width="70" height="18" rx="4" fill="#181825" />
      <text x="535" y="138" font-family="system-ui, sans-serif" font-size="9" fill="#a6e3a1" text-anchor="middle">Zero DB</text>
      <text x="535" y="155" font-family="system-ui, sans-serif" font-size="8" fill="#bac2de" text-anchor="middle">Pure Static</text>
    </g>

    <text x="400" y="365" font-family="Courier New, monospace" font-size="12" fill="#a6adc8" text-anchor="middle">⚡ High Performance • Zero Database Latency • Complete Separation of Concerns</text>
  </g>
</svg>

