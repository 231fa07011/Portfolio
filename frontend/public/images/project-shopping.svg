<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="tealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <circle cx="700" cy="90" r="130" fill="#bae6fd" opacity="0.3" />
  <circle cx="120" cy="370" r="150" fill="#ddd6fe" opacity="0.3" />

  <!-- App Window -->
  <g filter="url(#shadow2)">
    <rect x="70" y="45" width="660" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="70" y="45" width="660" height="42" rx="16" fill="#f8fafc" />
    <path d="M 70 87 L 730 87" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="95" cy="66" r="5" fill="#f43f5e" />
    <circle cx="112" cy="66" r="5" fill="#f59e0b" />
    <circle cx="129" cy="66" r="5" fill="#10b981" />
    
    <!-- Search Bar in Header -->
    <rect x="220" y="55" width="280" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="240" y="71" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">🔍 Search products, electronics, apparel...</text>
    <rect x="620" y="55" width="80" height="24" rx="12" fill="#0284c7" />
    <text x="660" y="71" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Cart (3)</text>

    <!-- Filters Left Column -->
    <rect x="70" y="88" width="160" height="317" fill="#f8fafc" />
    <text x="90" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Categories</text>
    <rect x="90" y="128" width="120" height="22" rx="6" fill="#e0f2fe" />
    <text x="100" y="143" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0284c7">All Electronics</text>
    <text x="100" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Smartphones</text>
    <text x="100" y="197" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Audio &amp; Wearables</text>
    <text x="100" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Laptops &amp; Gear</text>
    
    <text x="90" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Price Filter</text>
    <rect x="90" y="275" width="120" height="6" rx="3" fill="#e2e8f0" />
    <rect x="90" y="275" width="70" height="6" rx="3" fill="#0284c7" />
    <circle cx="160" cy="278" r="6" fill="#0284c7" />
    <text x="90" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">₹500 - ₹50,000</text>

    <!-- Product Grid -->
    <g transform="translate(250, 105)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <rect x="15" y="12" width="110" height="75" rx="6" fill="#e0f2fe" />
        <text x="70" y="55" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🎧</text>
        <text x="12" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Wireless ANC Pro</text>
        <text x="12" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">⭐⭐⭐⭐☆ (4.5)</text>
        <text x="12" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">₹3,499</text>
        <rect x="12" y="152" width="116" height="20" rx="4" fill="#0284c7" />
        <text x="70" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="140" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <rect x="15" y="12" width="110" height="75" rx="6" fill="#ede9fe" />
        <text x="70" y="55" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">⌚</text>
        <text x="12" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Fitness Smartwatch</text>
        <text x="12" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">⭐⭐⭐⭐⭐ (4.9)</text>
        <text x="12" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">₹2,199</text>
        <rect x="12" y="152" width="116" height="20" rx="4" fill="#0284c7" />
        <text x="70" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="140" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <rect x="15" y="12" width="110" height="75" rx="6" fill="#fef3c7" />
        <text x="70" y="55" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">💻</text>
        <text x="12" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Ultrabook 15"</text>
        <text x="12" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">⭐⭐⭐⭐☆ (4.7)</text>
        <text x="12" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">₹54,990</text>
        <rect x="12" y="152" width="116" height="20" rx="4" fill="#0284c7" />
        <text x="70" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Add to Cart</text>
      </g>
    </g>
  </g>
</svg>

